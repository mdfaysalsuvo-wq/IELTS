<style>
:root{--ink:#0f3b38;--mut:#55766f;--pri:#0e9f8e;--soft:rgba(14,159,142,.12);--g:rgba(255,255,255,.58);--gb:rgba(255,255,255,.85);--line:rgba(14,159,142,.22);--ok:#2f9e44;--bad:#d03c3c;--bg:radial-gradient(circle at 12% 8%,#c9f2e6 0,transparent 42%),radial-gradient(circle at 90% 20%,#e6f8f1 0,transparent 40%),radial-gradient(circle at 50% 95%,#b9ecdb 0,transparent 45%),#f2fbf7;box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg) fixed;color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65}
header{text-align:center;padding:22px 16px 4px}
header h1{margin:0;font-size:27px;color:var(--pri)}

nav{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;max-width:920px;margin:auto}
nav button{flex:none;border:1px solid var(--gb);background:var(--g);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:920px;margin:auto;padding:4px 14px 40px}
.card{background:var(--g);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--gb);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 30px rgba(14,159,142,.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
h2{margin:0 0 6px;font-size:20px}h3{margin:14px 0 6px;font-size:16px}
.mut{color:var(--mut);font-size:14px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:10px 18px;font:inherit;cursor:pointer;margin:6px 6px 0 0}
.btn.ghost{background:var(--soft);color:var(--pri)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.wrap{overflow-x:auto}
.q{padding:10px 0;border-bottom:1px solid var(--line)}

.q label:hover{background:var(--soft)}
.q input[type=text]{width:100%;max-width:320px;margin-top:4px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--g);color:var(--ink);font:inherit}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.passage{background:var(--soft);border-radius:14px;padding:14px;font-size:15px;margin:8px 0}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:var(--g);color:var(--ink);resize:vertical}
.score{text-align:center;padding:16px;border-radius:16px;background:var(--soft);margin-top:12px}
.score b{font-size:44px;color:var(--pri);display:block;line-height:1.1}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.pill{display:inline-block;background:var(--soft);color:var(--pri);border-radius:99px;padding:2px 10px;font-size:12px;margin-right:6px}
.tm{float:right;background:var(--soft);color:var(--pri);padding:3px 12px;border-radius:99px;font-weight:600;font-size:14px}
html,body{overflow-x:hidden}
header h1{font-size:34px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#0e9f8e,#3ccfa6);-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{transition:all .2s}nav button:hover{transform:translateY(-1px)}
nav button.on{background:linear-gradient(135deg,#0e9f8e,#3ccfa6);box-shadow:0 6px 16px rgba(14,159,142,.35)}
.card{transition:transform .2s,box-shadow .2s;border-top:1px solid rgba(255,255,255,.95)}
.grid .card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(14,159,142,.22)}
.btn{background:linear-gradient(135deg,#0e9f8e,#3ccfa6);box-shadow:0 6px 14px rgba(14,159,142,.28);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}.btn.ghost{box-shadow:none}
.ico{font-size:32px;width:60px;height:60px;display:grid;place-items:center;border-radius:18px;background:var(--soft);margin-bottom:8px}
.hero{background:linear-gradient(135deg,rgba(14,159,142,.92),rgba(60,207,166,.88));color:#fff;border:0}.hero h2{font-size:24px}.hero p{margin:0 0 6px;opacity:.95}
.score{background:linear-gradient(135deg,var(--soft),rgba(255,255,255,.3));border:1px solid var(--gb)}.score b{font-size:52px;font-weight:800}
.q label:has(input:checked){background:var(--soft);box-shadow:inset 0 0 0 1px var(--pri)}
textarea:focus,.q input[type=text]:focus{outline:2px solid var(--pri);outline-offset:1px}
main>*{animation:up .45s ease both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fl{to{transform:translate(40px,30px) scale(1.15)}}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
body::before{width:280px;height:280px;background:#7fe0c4;top:-70px;left:-70px;animation:fl 12s ease-in-out infinite alternate}
body::after{width:320px;height:320px;background:#bdf0e0;bottom:-90px;right:-90px;animation:fl 15s ease-in-out infinite alternate-reverse}
footer{text-align:center;padding:8px 16px 30px;color:var(--mut);font-size:14px}footer span{display:inline-block;background:var(--g);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--gb);border-radius:99px;padding:8px 20px;box-shadow:0 6px 20px rgba(14,159,142,.12)}footer b{background:linear-gradient(90deg,#0e9f8e,#3ccfa6);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:15px}

function timer(sec,end,label){clearInterval(tI);const el=$("#tm");if(!el)return;let s=sec;const f=()=>{el.textContent=(label||"⏱")+" "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(s--<=0){clearInterval(tI);end&&end()}};f();tI=setInterval(f,1000)}

const TABS=[["home","হোম"],["listening","Listening"],["reading","Reading"],["writing","Writing"],["speaking","Speaking"],["vocab","শব্দভান্ডার"],["tools","টুলস"],["progress","প্রোগ্রেস"]];
const V={};
function go(v){clearInterval(tI);window.speechSynthesis&&speechSynthesis.cancel();try{rec&&rec.stop()}catch(e){}$("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]===v?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");V[v]();window.scrollTo(0,0)}

function quiz(skill,qs,box,pre,secs,post){
  box.innerHTML=pre+qs.map((q,i)=>`<div class="q"><div>${i+1}. ${q.q}</div>`+(q.t=="f"?`<input type="text" id="a${i}" placeholder="উত্তর লেখো">`:q.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join(""))+`<div id="f${i}"></div></div>`).join("")+`<button class="btn" id="sub">জমা দাও ও স্কোর দেখো</button><div id="res"></div>`;
  let done=0;
  const sub=()=>{if(done)return;done=1;clearInterval(tI);let c=0;
    qs.forEach((q,i)=>{let ok=0;if(q.t=="f")ok=q.a.includes($("#a"+i).value.trim().toLowerCase().replace(/^£/,""));else{const s=document.querySelector(`input[name=q${i}]:checked`);ok=s&&+s.value==q.a}
      if(ok)c++;$("#f"+i).innerHTML=ok?'<span class="ok">সঠিক ✓</span>':`<span class="bad">ভুল ✗</span> সঠিক উত্তর: ${q.t=="f"?q.a[0]:q.o[q.a]}`});
    const b=rawBand(c,qs.length);save(skill,b);
    $("#res").innerHTML=`<div class="score"><b>Band ${b}</b>${c} / ${qs.length} সঠিক<div class="mut">৪০ প্রশ্নের স্কেলে আনুমানিক ব্যান্ড</div></div>${post||""}<button class="btn" onclick="go('${skill.toLowerCase()}')">নতুন প্রশ্ন সেট</button>`};
  $("#sub").onclick=sub;if(secs)timer(secs,sub);
}

function wr(k){
  const min=k==1?150:250;let h;
  if(k==1){const d=W1[pick("W1",W1.length)];h=`${d.p} Summarise the information by selecting and reporting the main features, and make comparisons where relevant.<div class="wrap"><table class="tbl"><tr>${d.c.map(x=>`<th>${x}</th>`).join("")}</tr>${d.r.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`}
  else h=W2[pick("W2",W2.length)]+" Give reasons for your answer and include any relevant examples from your own knowledge or experience.";
  $("#app").innerHTML=`<div class="card"><div class="tm" id="tm"></div><h2>Writing Task ${k}</h2><div class="passage">${h}</div><p class="mut">Write at least ${min} words.</p><textarea id="wt" placeholder="এখানে লেখো..."></textarea><div class="mut" id="wc">0 words</div><button class="btn" id="ws">স্কোর দেখো</button><button class="btn ghost" onclick="wr(${k})">নতুন প্রশ্ন</button><div id="res"></div></div>`;
  $("#wt").oninput=function(){$("#wc").textContent=this.value.trim().split(/\s+/).filter(Boolean).length+" words"};
  const sub=()=>{clearInterval(tI);const r=evalW($("#wt").value,min);if(!r){$("#res").innerHTML='<p class="bad">আগে কিছু লেখো।</p>';return}save("Writing",r.o);$("#res").innerHTML=report(r)};
  $("#ws").onclick=sub;timer(k==1?1200:2400,sub);
}
function evalW(t,min){
  const w=t.trim().split(/\s+/).filter(Boolean),n=w.length;if(n<5)return null;
  const paras=t.split(/\n\s*\n/).filter(x=>x.trim()).length,need=min>200?4:3;
  const lk=(t.match(/\b(however|moreover|furthermore|therefore|in addition|for example|for instance|on the other hand|in conclusion|consequently|although|whereas|because|as a result|firstly|secondly|finally|while|overall|in contrast)\b/gi)||[]).length;
  const uniq=new Set(w.map(x=>x.toLowerCase().replace(/[^a-z]/g,""))).size/n,long=w.filter(x=>x.replace(/[^a-z]/gi,"").length>=8).length/n;
  const sent=Math.max(1,t.split(/[.!?]+/).filter(s=>s.trim()).length),avg=n/sent,commas=(t.match(/,/g)||[]).length/sent;
  let tr=n>=min?6.5:n>=min*.8?5.5:n>=min*.6?4.5:n>=min*.3?3.5:2;if(paras>=need)tr+=.5;
  const low=n<min*.3;
  const cc=low?3:4.5+Math.min(lk,8)*.4+(paras>=need?.5:0),lr=low?3:4.5+Math.max(0,uniq-.45)*6+long*6,gr=low?3:(avg>=12&&avg<=26?5.5:4.5)+Math.min(commas,1.2)*.8+(lk>3?.5:0);
  const c=[["Task Achievement/Response",tr],["Coherence & Cohesion",cc],["Lexical Resource",lr],["Grammar Range",gr]].map(x=>[x[0],half(Math.min(x[1],8))]);
  const tips=[];if(n<min)tips.push(`শব্দসংখ্যা ${min}-এর কম, আরও তথ্য বা যুক্তি যোগ করো।`);if(paras<need)tips.push(`কমপক্ষে ${need}টি অনুচ্ছেদ লেখো (ভূমিকা, মূল অংশ, উপসংহার/overview)।`);if(lk<4)tips.push("However, Moreover, For example, In contrast-এর মতো সংযোজক শব্দ ব্যবহার করো।");if(uniq<.55)tips.push("একই শব্দ বারবার না লিখে সমার্থক শব্দ ব্যবহার করো।");if(!tips.length)tips.push("ভালো হয়েছে! এবার জটিল বাক্য ও নির্ভুল ব্যাকরণে মনোযোগ দাও।");
  return{o:half(c.reduce((a,x)=>a+x[1],0)/c.length),c,tips,n};
}
function report(r){return `<div class="score"><b>Band ${r.o}</b>${r.n} শব্দ বিশ্লেষণ করা হয়েছে</div><h3>ক্রাইটেরিয়া অনুযায়ী</h3>${r.c.map(x=>`<div>${x[0]} · <b>${x[1]}</b></div><div class="bar"><i style="width:${x[1]/9*100}%"></i></div>`).join("")}<h3>উন্নতির পরামর্শ</h3><ul>${r.tips.map(t=>`<li>${t}</li>`).join("")}</ul><p class="mut">এটি স্বয়ংক্রিয় আনুমানিক স্কোর, আসল পরীক্ষকের মূল্যায়ন নয়।</p>`}

V.speaking=()=>{
  const a=P1[pick("S1",P1.length)],b=P2[pick("S2",P2.length)],tg=[40,150,80];
  const items=[...a[1].map(q=>({p:1,q})),{p:2,q:b[0]},...b[1].map(q=>({p:3,q}))],ans=[];let i=0;
  const show=()=>{const it=items[i];
    $("#app").innerHTML=`<div class="card"><div class="tm" id="tm"></div><h2>Speaking · Part ${it.p}</h2><span class="pill">${i+1} / ${items.length}</span>${it.p==1?`<span class="pill">Topic: ${a[0]}</span>`:""}<div class="passage">${it.q}</div><p class="mut">${it.p==2?"১ মিনিট প্রস্তুতি নাও, তারপর ২ মিনিট বলো।":"ইংরেজিতে উত্তর দাও। Mic না চললে টাইপ করো।"}</p><button class="btn" id="mic">🎤 Start speaking</button><button class="btn ghost" id="hear">🔊 প্রশ্ন শোনো</button><textarea id="st" style="min-height:130px" placeholder="উত্তর এখানে..."></textarea><button class="btn" id="nx">${i<items.length-1?"পরের প্রশ্ন →":"শেষ করো ও স্কোর দেখো"}</button></div>`;
    if(it.p==2)timer(60,()=>timer(120,null,"🗣"),"📝");
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let on=0;
    $("#mic").onclick=()=>{if(!SR){$("#mic").textContent="mic সাপোর্ট নেই, টাইপ করো";return}if(on){rec.stop();return}
      rec=new SR();rec.lang="en-US";rec.continuous=true;const base=$("#st").value;
      rec.onresult=e=>{let s="";for(let k=0;k<e.results.length;k++)s+=e.results[k][0].transcript+" ";$("#st").value=(base+" "+s).trim()};
      rec.onend=()=>{on=0;$("#mic").textContent="🎤 Start speaking"};rec.start();on=1;$("#mic").textContent="■ Stop"};
    $("#hear").onclick=()=>{if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(it.q);u.lang="en-GB";u.rate=.9;speechSynthesis.speak(u)}};
    $("#nx").onclick=()=>{window.speechSynthesis&&speechSynthesis.cancel();try{rec&&rec.stop()}catch(e){}clearInterval(tI);ans.push({p:it.p,t:$("#st").value.trim()});i++;i<items.length?show():fin()};
  };
  const fin=()=>{
    const sc=ans.map(x=>{const w=x.t.split(/\s+/).filter(Boolean),n=w.length,T=tg[x.p-1];if(n<3)return[2,2,2];
      const fill=(x.t.match(/\b(um|uh|er|erm|you know)\b/gi)||[]).length/n,u=new Set(w.map(y=>y.toLowerCase())).size/n,lg=w.filter(y=>y.length>=7).length/n,sn=Math.max(1,x.t.split(/[.!?]+/).filter(s=>s.trim()).length),r=Math.min(n/T,1);
      return[Math.min(4+r*2.5-fill*6,8),Math.min(4+r+Math.max(0,u-.4)*4+lg*6,8),Math.min(4.5+r+Math.min(n/sn/15,1),8)]});
    const avg=k=>sc.reduce((m,x)=>m+x[k],0)/sc.length;
    const c=[["Fluency & Coherence",half(avg(0))],["Lexical Resource",half(avg(1))],["Grammar Range",half(avg(2))]],o=half(c.reduce((m,x)=>m+x[1],0)/3),words=ans.reduce((m,x)=>m+x.t.split(/\s+/).filter(Boolean).length,0);
    save("Speaking",o);
    const tips=[];if(ans.some((x,k)=>x.t.split(/\s+/).filter(Boolean).length<tg[x.p-1]*.7))tips.push("কিছু উত্তর ছোট ছিল। কারণ ও উদাহরণ দিয়ে লম্বা করো (Part 1: ~৪০, Part 2: ~১৫০, Part 3: ~৮০ শব্দ)।");tips.push("Um, uh কমিয়ে থেমে ভেবে বলো।");
    $("#app").innerHTML=`<div class="card"><h2>Speaking ফলাফল</h2>${report({o,c,tips,n:words})}<p class="mut">উচ্চারণ স্বয়ংক্রিয়ভাবে মাপা হয়নি।</p><button class="btn" onclick="go('speaking')">নতুন প্রশ্ন সেট</button></div>`;
  };
  show();
};
V.progress=()=>{
  if(!store.length){$("#app").innerHTML='<div class="card"><h2>তোমার প্রোগ্রেস</h2><p class="mut">এখনো কোনো প্র্যাকটিস করোনি। যেকোনো অংশ শেষ করলে এখানে স্কোর জমা হবে।</p><button class="btn" onclick="go(\'listening\')">শুরু করো</button></div>';return}
  const av=["Listening","Reading","Writing","Speaking"].map(s=>{const a=store.filter(x=>x.skill===s);return[s,a.length,a.length?a.reduce((m,x)=>m+x.band,0)/a.length:0,a.length?a[a.length-1].band:0]}),dn=av.filter(a=>a[1]);
  $("#app").innerHTML=`<div class="card"><h2>তোমার প্রোগ্রেস</h2>${topBlock(dn)}<h3>অংশ অনুযায়ী</h3>${av.map(a=>`<div>${a[0]} · গড় <b>${a[1]?half(a[2]):"-"}</b> · সর্বশেষ ${a[1]?a[3]:"-"} · ${a[1]} বার</div><div class="bar"><i style="width:${a[2]/9*100}%"></i></div>`).join("")}<h3>সাম্প্রতিক ফলাফল</h3>${store.slice(-8).reverse().map(x=>`<div class="mut">${x.skill}: Band ${x.band} · ${new Date(x.t).toLocaleDateString()}</div>`).join("")}<button class="btn ghost" id="clr">সব মুছে ফেলো</button></div>`;
  $("#clr").onclick=()=>{store=[];S={};persist();V.progress()};
};
const gT=()=>{try{return +localStorage.getItem("target")||7}catch(e){return 7}};
function setT(v){try{localStorage.setItem("target",v)}catch(e){}V.progress()}
function streak(){const d=new Set(store.map(x=>new Date(x.t).toDateString()));let n=0,c=new Date();if(!d.has(c.toDateString()))c.setDate(c.getDate()-1);while(d.has(c.toDateString())){n++;c.setDate(c.getDate()-1)}return n}
function topBlock(dn){const o=half(dn.reduce((m,a)=>m+a[2],0)/dn.length),t=gT(),last=store.slice(-10),y=b=>100-b/9*100,pts=last.map((x,i)=>`${last.length>1?i*300/(last.length-1):150},${y(x.band)}`).join(" "),today=store.filter(x=>new Date(x.t).toDateString()==new Date().toDateString()).length;
  return `<div class="score"><b>${o}</b>Overall Band (গড়)<div class="mut">টার্গেট ${t} · ${o>=t?"টার্গেট ছুঁয়ে ফেলেছো! 🎉":"আরও "+(t-o)+" ব্যান্ড বাকি"}<br>🔥 ${streak()} দিনের স্ট্রিক · আজ ${today}টি প্র্যাকটিস</div></div><label class="mut">টার্গেট ব্যান্ড: <select onchange="setT(this.value)">${[5,5.5,6,6.5,7,7.5,8,8.5,9].map(v=>`<option ${v==t?"selected":""}>${v}</option>`).join("")}</select></label><h3>সাম্প্রতিক ১০টি স্কোরের গ্রাফ</h3><svg viewBox="-8 -8 316 116" style="width:100%;max-height:150px"><line x1="0" x2="300" y1="${y(t)}" y2="${y(t)}" stroke="currentColor" stroke-dasharray="4" opacity=".4"/><polyline fill="none" stroke="var(--pri)" stroke-width="3" stroke-linejoin="round" points="${pts}"/>${last.map((x,i)=>`<circle r="4" fill="var(--pri)" cx="${last.length>1?i*300/(last.length-1):150}" cy="${y(x.band)}"/>`).join("")}</svg><div class="mut">ড্যাশ লাইন = তোমার টার্গেট</div>`}
const WORDS=[["mitigate","প্রশমিত করা","Governments must mitigate the effects of climate change."],["substantial","উল্লেখযোগ্য","There was a substantial increase in prices."],["fluctuate","ওঠানামা করা","Temperatures fluctuate throughout the year."],["detrimental","ক্ষতিকর","Smoking is detrimental to health."],["inevitable","অবশ্যম্ভাবী","Change is inevitable."],["advocate","সমর্থন করা","Many experts advocate healthier diets."],["comprehensive","সামগ্রিক","A comprehensive study was carried out."],["sustainable","টেকসই","We need sustainable energy sources."],["scarce","দুষ্প্রাপ্য","Water is scarce in some regions."],["alleviate","লাঘব করা","Better transport can alleviate traffic."],["controversial","বিতর্কিত","The policy is highly controversial."],["enhance","উন্নত করা","Exercise can enhance concentration."],["curb","নিয়ন্ত্রণ করা","Taxes can curb pollution."],["disparity","বৈষম্য, ব্যবধান","There is a disparity between rich and poor."],["consequently","ফলস্বরূপ","Prices rose; consequently, demand fell."],["prevalent","বহুল প্রচলিত","Obesity is prevalent in many countries."],["adequate","পর্যাপ্ত","The funding is not adequate."],["considerable","যথেষ্ট","A considerable number of students agreed."],["diminish","হ্রাস পাওয়া","Interest in the topic began to diminish."],["abundant","প্রচুর","Fresh fruit is abundant in summer."],["inhibit","বাধা দেওয়া","Stress can inhibit learning."],["trigger","সূচনা করা","Pollution can trigger asthma."],["prioritise","অগ্রাধিকার দেওয়া","Governments should prioritise education."],["contemporary","সমসাময়িক","Contemporary art attracts young visitors."]];
V.vocab=()=>{

  const setK=k=>{try{localStorage.setItem("vk",JSON.stringify(k))}catch(e){}},left=WORDS.map((w,i)=>i).filter(i=>!known.includes(i));
  if(!left.length){$("#app").innerHTML=`<div class="card"><h2>শব্দভান্ডার</h2><p>অভিনন্দন! সব ${WORDS.length}টি শব্দ শিখে ফেলেছো 🎉</p><button class="btn" id="rs">আবার শুরু করো</button></div>`;$("#rs").onclick=()=>{setK([]);V.vocab()};return}
  const i=left[rnd(left.length)],w=WORDS[i];
  $("#app").innerHTML=`<div class="card"><h2>IELTS শব্দভান্ডার</h2><span class="pill">শেখা হয়েছে ${known.length} / ${WORDS.length}</span><div class="passage" style="text-align:center"><div style="font-size:30px;font-weight:700;color:var(--pri)">${w[0]}</div><button class="btn ghost" id="sp">🔊 উচ্চারণ</button><div id="mn" style="display:none"><h3>${w[1]}</h3><div class="mut">${w[2]}</div></div></div><button class="btn" id="sh">অর্থ দেখো</button><button class="btn ghost" id="kn">জানি ✓</button><button class="btn ghost" id="nk">পরে আবার দেখাও</button></div>`;
  $("#sp").onclick=()=>{if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w[0]);u.lang="en-GB";speechSynthesis.speak(u)}};
  $("#sh").onclick=()=>{$("#mn").style.display="block"};
  $("#kn").onclick=()=>{known.push(i);setK(known);V.vocab()};
  $("#nk").onclick=()=>V.vocab();
};
V.tools=()=>{
  const L=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  $("#app").innerHTML=`<div class="card"><h2>Overall Band ক্যালকুলেটর</h2><p class="mut">৪টি অংশের ব্যান্ড দিলে Overall বের হবে।</p><div class="grid">${["Listening","Reading","Writing","Speaking"].map(s=>`<label class="mut">${s}<input type="number" min="0" max="9" step="0.5" class="cin" style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--g);color:var(--ink);font:inherit"></label>`).join("")}</div><button class="btn" id="calc">হিসাব করো</button><div id="cres"></div></div>
  <div class="card"><h2>Useful Phrases</h2><h3>Writing Task 1</h3>${L(["The table illustrates / shows ...","It is clear that ... was the highest.","X rose sharply from A to B.","In contrast, Y remained stable.","Overall, the main trend is ..."])}<h3>Writing Task 2</h3>${L(["It is often argued that ...","On the one hand, ... On the other hand, ...","A major advantage of this is ...","In my opinion, ...","In conclusion, I firmly believe that ..."])}<h3>Speaking</h3>${L(["Well, to be honest, ...","That is an interesting question, I would say ...","What I mean is ...","For instance, ...","I have never really thought about it, but ..."])}</div>
  <div class="card"><h3>প্রোগ্রেস ব্যাকআপ</h3><p class="mut">ব্রাউজার বদলালে বা ডেটা মুছলে প্রোগ্রেস হারাতে পারো। কোড কপি করে রাখো, পরে পেস্ট করে ফিরিয়ে আনো।</p><textarea id="bk" style="min-height:80px"></textarea><button class="btn" id="bex">ব্যাকআপ কোড তৈরি</button><button class="btn ghost" id="bim">কোড থেকে ফিরিয়ে আনো</button><div id="bmsg" class="mut"></div></div>
  <div class="card"><h3>পরীক্ষার দিনের টিপস</h3>${L(["Listening: প্রশ্ন আগে পড়ো, বানান ও সংখ্যা ঠিক লেখো।","Reading: সময় ভাগ করো, একটি প্রশ্নে আটকে থেকো না।","Writing: শুরুর ২-৩ মিনিট plan করো, শেষে ২ মিনিট চেক করো।","Speaking: থেমে না গিয়ে সহজ বাক্যে হলেও বলে যাও।"])}</div>`;
  $("#bex").onclick=()=>{let vk="[]";try{vk=localStorage.getItem("vk")||"[]"}catch(e){}$("#bk").value=btoa(unescape(encodeURIComponent(JSON.stringify({s:store,seen:S,vk:JSON.parse(vk),t:gT()}))));$("#bk").select();$("#bmsg").textContent="কোড তৈরি হয়েছে, কপি করে রাখো।"};
  $("#bim").onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim()))));store=d.s||[];S=d.seen||{};persist();localStorage.setItem("vk",JSON.stringify(d.vk||[]));localStorage.setItem("target",d.t||7);$("#bmsg").textContent="ফিরিয়ে আনা হয়েছে ✓"}catch(e){$("#bmsg").textContent="কোডটি ঠিক নেই।"}};
  $("#calc").onclick=()=>{const v=[...document.querySelectorAll(".cin")].map(x=>parseFloat(x.value));$("#cres").innerHTML=v.some(x=>isNaN(x)||x<0||x>9)?'<p class="bad">৪টি ঘরেই ০–৯ এর মধ্যে ব্যান্ড দাও।</p>':`<div class="score"><b>${Math.round(v.reduce((a,b)=>a+b,0)/4*2)/2}</b>Overall Band</div>`};
};
go("home");
</script>
